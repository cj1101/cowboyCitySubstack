# =============================================================================
# Cowboy City — CI  ·  Phase 0 (Build Plan v1.2)
# Spec: workstreams/phase0-readiness.md §4 (Priya, DevOps). Draft adapted from
# workstreams/ci-workflow-draft.yml (Osei, QA) per that spec's adaptation pass.
#
# Required checks: "Install · Typecheck · Lint · Build" and "Rules tests"
#   npm ci -> npm run typecheck -> npm run lint -> npm run build
# Those jobs' definitions below are the branch-protection contract — do
# not rename them, and do not fold other steps into them.
#
# The second job, "Rules tests", runs the Firestore/Storage rules suite
# (test:rules, Firebase emulators). It began as a non-required baseline
# job and was promoted to required after green, stable runs on
# unmodified master met the promotion criteria (phase0-readiness.md
# §4.4; evidence in workstreams/rules-promotion-evidence.md). Its
# display name IS its branch-protection context: renaming it without
# updating branch protection in the same window would block all merges
# on a check that never reports.
#
# Deliberately NOT here (phase0-readiness.md §3):
#   - No `npm test` step: package.json has no `test` script; a step that
#     cannot fail is worse than no step.
#   - No deploy job: Vercel's Git integration deploys; CI verifies only.
#   - No secrets, no write-back: permissions are read-only by design.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Install · Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # MUST equal the Vercel project's Node.js Version setting.
          # No engines field, vercel.json, or .nvmrc exists in this repo;
          # the only measured baseline (repo-inventory.md §1, and the local
          # verification for this PR) passed on Node v24.20.0, so 24 is the
          # defensible pin until the Vercel setting is confirmed — if Vercel
          # says otherwise, this value changes to match it.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  rules-tests:
    # =========================================================================
    # REQUIRED — this job is in branch protection as "Rules tests".
    #
    # Purpose: run the rules suite's true baseline in GitHub Actions.
    # The suite cannot be observed locally: in the dev sandbox, the
    # Firestore emulator rejects its own rules-upload endpoint for every
    # client (a sandbox loopback defect — see
    # workstreams/test-rules-baseline-report.md), so no local baseline
    # exists. Actions runners have clean loopback; this job IS the
    # baseline venue.
    #
    # Failure semantics: a red run blocks merges — that is the point of
    # the promotion. The suite earned required status by running green
    # and stable on unmodified master (promotion criteria:
    # phase0-readiness.md §4.4; evidence:
    # workstreams/rules-promotion-evidence.md — Theo's addendum: four
    # consecutive green master-push runs at the evidence date, and every
    # master-push run green since). Do NOT paper over failures with
    # `continue-on-error: true`: the check must show its real color in
    # the PR checks list, or the evidence is worthless.
    #
    # Name trap: this job's display name IS its branch-protection
    # context. Renaming it without updating branch protection in the
    # same window blocks all merges on a check that never reports.
    # =========================================================================
    name: Rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same pin as the required job and Vercel (Node 24).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rules tests (Firebase emulators)
        # Emulators are local processes: no secrets, no firebase login,
        # no project access needed.
        run: npm run test:rules

      - name: Upload emulator debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 14

  sim-core-tests:
    # =========================================================================
    # NON-REQUIRED — do NOT add this job to branch protection.
    #
    # Purpose: run the Phase 2 engine suite (tests/sim-core.test.ts: the
    # resolver core, committer, pendings/AGR, undo battery, Baseline
    # fail-closed checks) against the Firestore + Auth emulators in a
    # clean environment. Like the rules suite, it has never run locally:
    # the dev sandbox's emulator rejects its own rules upload (the known
    # loopback defect), so Actions is the authoritative venue.
    #
    # Failure semantics mirror the rules job: a red run shows its real
    # color, never continue-on-error, and never blocks merges — only
    # "Install · Typecheck · Lint · Build" is branch-protected. The
    # distinct name ("Sim core tests (non-required)") keeps it visually
    # separate. Promotion follows the same separate-PR path as the rules
    # job after green, stable runs on unmodified master.
    # =========================================================================
    name: Sim core tests (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same pin as the required job and Vercel (Node 24).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sim core tests (Firebase emulators)
        # Emulators are local processes: no secrets, no firebase login,
        # no project access needed.
        run: npm run test:sim

      - name: Upload emulator debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-core-emulator-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 14
